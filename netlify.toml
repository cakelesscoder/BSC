[build]
  # Optionally set IMAGE_BASE_URL in Netlify → Site configuration → Environment variables
  # to override the image path (e.g. https://your-site-name.netlify.app/images).
  # build.py reads that env var directly; no shell expansion needed here.
  command = "python3 build.py"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"
