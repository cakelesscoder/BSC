<!--
  ============================================================
  Orion Base System Configurator — Squarespace embed snippet
  ============================================================
  HOW TO USE:
    1. In Squarespace, add a Code Block to the page where you
       want the configurator to appear.
    2. Paste the entire contents of this file into that block.
    3. Save and preview. The configurator loads inside the block
       and auto-resizes to avoid an inner scrollbar.

  WHAT THE RESIZE MECHANISM DOES:
    The configurator sends a postMessage on every step change
    with its current content height. The script below catches
    those messages and updates the iframe height accordingly,
    so the Squarespace page never shows dead space inside
    the embed block.

  CLIPBOARD PERMISSION:
    allow="clipboard-write" on the iframe is required so the
    copy-to-clipboard button on the summary screen works when
    the configurator is loaded from a different domain.
  ============================================================
-->

<style>
  #orion-bsc-frame {
    display: block;
    width: 100%;
    border: none;
    outline: none;
    overflow: hidden;
    /* Smooth height transitions prevent a jarring jump between steps. */
    transition: height 0.2s ease-out;
  }

  /*
    Squarespace's .sqs-block-content wrapper can lock at the tallest height
    it has ever rendered. Force it to follow the iframe's actual height.
  */
  .sqs-block-code,
  .sqs-block-code > .sqs-block-content,
  .sqs-block-content:has(#orion-bsc-frame) {
    height: auto !important;
    min-height: 0 !important;
  }
</style>

<iframe
  id="orion-bsc-frame"
  src="https://cakelesscoder.github.io/BSC/"
  title="Orion Base System Configurator"
  loading="lazy"
  allow="clipboard-write"
></iframe>

<script>
(function () {
  // Only accept resize messages from the configurator's origin.
  var ALLOWED_ORIGIN = 'https://cakelesscoder.github.io';

  var frame = document.getElementById('orion-bsc-frame');

  window.addEventListener('message', function (event) {
    if (event.origin !== ALLOWED_ORIGIN) return;

    var data = event.data;

    // Resize: keep iframe height honest.
    if (data && data.type === 'orion-bsc-resize') {
      var h = parseInt(data.height, 10);
      if (!isNaN(h) && h > 0) {
        frame.style.height = h + 'px';

        // Also release any Squarespace parent that may have locked to a tall height.
        var p = frame.parentElement;
        if (p) {
          p.style.height = 'auto';
          p.style.minHeight = '0';
        }
        if (p && p.parentElement) {
          p.parentElement.style.height = 'auto';
          p.parentElement.style.minHeight = '0';
        }
      }
    }

    // URL request: the configurator can't read window.parent.location cross-origin,
    // so it asks us. We reply with the current Squarespace page URL.
    if (data && data.type === 'orion-bsc-request-url') {
      try {
        frame.contentWindow.postMessage(
          { type: 'orion-bsc-parent-url', url: window.location.href },
          ALLOWED_ORIGIN
        );
      } catch (e) {}
    }

    // Lightbox open: position:fixed inside an iframe is fixed to the iframe
    // document origin, not the browser viewport.  Scroll the iframe's top edge
    // to the top of the viewport so the overlay covers the full screen.
    if (data && data.type === 'orion-bsc-scroll-to-top') {
      frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
})();
</script>
